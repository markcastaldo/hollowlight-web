<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Hollowlight bug reports</title>
<meta name="theme-color" content="#0d0a14">
<style>
:root{--bg:#0d0a14;--panel:#17121f;--line:#3a2f4a;--text:#f2e8d0;--dim:#9a90a8;--gold:#ffd65a;--teal:#8af0d0;--ember:#ffb04a;--red:#ff7a6a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 ui-monospace,Consolas,monospace}
.wrap{max-width:900px;margin:0 auto;padding:24px 16px 48px}
h1{font-size:24px;margin:0 0 4px;color:var(--gold);letter-spacing:.04em}
.sub{color:var(--dim);margin:0 0 16px}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
button,input,select{font:inherit;background:var(--panel);color:var(--text);border:1px solid var(--line);padding:4px 10px;border-radius:2px}
button:hover{border-color:var(--gold)}
.card{background:var(--panel);border:1px solid var(--line);padding:10px 12px;margin-bottom:10px}
.card.done{opacity:.55}
.head{display:flex;gap:10px;flex-wrap:wrap;align-items:baseline;color:var(--dim);font-size:12px}
.kind{font-weight:bold;text-transform:uppercase}.kind.bug{color:var(--red)}.kind.feedback{color:var(--teal)}
.msg{white-space:pre-wrap;word-break:break-word;margin:6px 0;font-size:15px}
.ctx{color:var(--dim);font-size:12px}
.note{color:var(--dim);padding:12px 0}
label{color:var(--dim)}
</style></head><body><div class="wrap">
<h1>BUG REPORTS</h1>
<div class="sub">What players sent from the pause menu's Report a bug / Feedback.</div>
<div id="login" class="bar" hidden><input id="pass" type="password" placeholder="Passphrase" autocomplete="current-password" size="28"><button id="go">Open</button><span id="lmsg" class="sub" style="margin:0"></span></div>
<div id="main" hidden>
 <div class="bar"><select id="kind"><option value="">Bugs + feedback</option><option value="bug">Bugs</option><option value="feedback">Feedback</option></select>
 <label><input id="showdone" type="checkbox"> show done</label><input id="find" placeholder="Search text / version" size="22">
 <button id="reload">Reload</button><span id="count" class="sub" style="margin:0"></span><button id="out" style="margin-left:auto">Forget passphrase</button></div>
 <div id="list"></div>
</div>
<div id="note" class="note"></div>
</div>
<script>
const SB="https://ugluevzmupcacioqrmpe.supabase.co",KEY="sb_publishable_imUXB0NUYQoNJwzLnrJdYw_7FMtFwwi",LS="hl_fb_pass";
const $=id=>document.getElementById(id);
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function getPass(){try{return localStorage.getItem(LS)||""}catch(e){return window._p||""}}
function setPass(p){window._p=p;try{p?localStorage.setItem(LS,p):localStorage.removeItem(LS)}catch(e){}}
async function rpc(fn,body){const r=await fetch(SB+"/rest/v1/rpc/"+fn,{method:"POST",headers:{apikey:KEY,"Content-Type":"application/json"},body:JSON.stringify(body)});
 if(!r.ok)throw new Error(r.status);return r.json()}
let rows=[];
function when(t){const d=new Date(t);return isNaN(d)?esc(t):d.toLocaleString()}
function ctx(r){const a=[];if(r.version)a.push("v"+r.version);if(r.platform)a.push(r.platform);if(r.input)a.push(r.input);if(r.screen)a.push(r.screen);
 if(r.day!=null)a.push("day "+r.day);if(r.phase)a.push(r.phase);if(r.area)a.push(r.area);if(r.pace)a.push(r.pace);if(r.difficulty)a.push(r.difficulty);
 if(r.depth)a.push("depth "+r.depth);if(r.seed!=null)a.push("seed "+r.seed);if(r.board)a.push("by "+r.board);if(r.run_id)a.push("run "+r.run_id);
 return a.map(esc).join(" &middot; ")}
function draw(){const k=$("kind").value,f=$("find").value.trim().toLowerCase();
 const shown=rows.filter(r=>(!k||r.kind===k)&&(!f||String(r.message).toLowerCase().includes(f)||String(r.version||"").includes(f)||String(r.board||"").toLowerCase().includes(f)));
 $("count").textContent=shown.length+" shown";
 $("list").innerHTML=shown.length?shown.map(r=>`<div class="card${r.done?" done":""}"><div class="head"><span class="kind ${esc(r.kind)}">${esc(r.kind)}</span><span>#${esc(r.id)}</span><span>${when(r.created_at)}</span>`+
  `<label style="margin-left:auto"><input type="checkbox" data-id="${esc(r.id)}" ${r.done?"checked":""}> done</label></div><div class="msg">${esc(r.message)}</div><div class="ctx">${ctx(r)}</div></div>`).join(""):
  '<div class="note">No reports here.</div>';
 for(const cb of $("list").querySelectorAll("input[type=checkbox]"))cb.onchange=async e=>{const id=+e.target.dataset.id,val=e.target.checked;
  try{const j=await rpc("feedback_mark",{pass:getPass(),rid:id,val:val});if(!j.ok){showLogin("The passphrase stopped working.");return}
   const r=rows.find(x=>x.id===id);if(r)r.done=val;if(!$("showdone").checked&&val)rows=rows.filter(x=>x.id!==id);draw()}catch(err){$("note").textContent="Couldn't save that - try again."}}}
async function load(){$("note").textContent="Loading...";
 try{const j=await rpc("feedback_list",{pass:getPass(),show_done:$("showdone").checked,lim:500});
  if(!j.ok){setPass("");showLogin("Wrong passphrase (or too many tries - wait 10 minutes).");return}
  rows=j.rows||[];$("login").hidden=true;$("main").hidden=false;$("note").textContent="";draw()}
 catch(e){$("note").textContent=String(e.message)==="404"?"The reports table isn't set up yet - run tools/supabase_feedback.sql.":"Couldn't reach the database."}}
function showLogin(m){$("main").hidden=true;$("login").hidden=false;$("lmsg").textContent=m||"";$("note").textContent="";$("pass").focus()}
$("go").onclick=()=>{const p=$("pass").value;if(!p)return;setPass(p);$("pass").value="";load()};
$("pass").onkeydown=e=>{if(e.key==="Enter")$("go").click()};
$("reload").onclick=load;$("showdone").onchange=load;$("kind").onchange=draw;$("find").oninput=draw;
$("out").onclick=()=>{setPass("");rows=[];$("list").innerHTML="";showLogin("")};
getPass()?load():showLogin("");
</script></body></html>
